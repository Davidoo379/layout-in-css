<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Layout 6</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* Doe hier jouw ding! */
    body {
      display: grid;
      grid-template-columns: 20% 1fr 25%;
      grid-template-rows: 20% 1fr;
      gap: 1.5rem;
      margin: 1.5rem;
    }

    header {
      grid-column: 1/3;
      grid-row: 1/2;
    }

    nav {
      grid-column: 1/2;
      grid-row: 2/3;
    }

    main {
      grid-column: 2/3;
      grid-row: 2/3;
    }

    footer {
      grid-column: 3/4;
      grid-row: 1/3;
    }
  </style>
</head>

<body id="basic-layout-6">
  <header>
    <h1>Basic Layout 6</h1>
  </header>
  <nav><a href="../index.html">Terug naar het overzicht</a></nav>
  <main></main>
  <footer></footer>
</body>

</html>
