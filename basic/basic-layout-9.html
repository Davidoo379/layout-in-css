<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Layout 9</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* Doe hier jouw ding! */
    body {
      display: grid;
      grid-template-columns: 20% 1fr;
      grid-template-rows: 20% 1fr 20%;
      gap: 1.5rem;
      margin: 1.5rem;
      font-size: 2rem;
    }

    header {
      grid-column: 1/2;
      grid-row: 1/2;
    }

    nav {
      grid-column: 2/3;
      grid-row: 1/2;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      gap: 1.5rem;

      a {
        background-color: white;
        padding: 1.5rem;
        border-radius: 1rem;
      }
    }

    main {
      grid-column: 1/3;
      grid-row: 2/3;
    }

    footer {
      grid-column: 1/3;
      grid-row: 3/4;
    }
  </style>
</head>

<body id="basic-layout-9">
  <header>
    <h1>Basic Layout 9</h1>
  </header>
  <nav>
    <a href="#">Home</a>
    <a href="#">Over ons</a>
    <a href="#">Contact</a>
  </nav>
  <main><a href="../index.html">Terug naar het overzicht</a></main>
  <footer></footer>
</body>

</html>
