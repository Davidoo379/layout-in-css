<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Layout 8</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* Doe hier jouw ding! */
    body {
      display: grid;
      grid-template-columns: 5% 20% 1fr;
      grid-template-rows: 1fr 20% 5%;
      margin: 2rem;
      overflow: clip;
    }

    header {
      position: absolute;
      left: -50px;
      top: -100px;
      width: 300px;
      height: 300px;
      z-index: 1;
      rotate: 30deg;
    }

    nav {
      grid-column: 2/3;
      grid-row: 2/4;
    }

    main {
      grid-column: 1/-1;
      grid-row: 1/3;
      z-index: -1;
    }

    footer {
      right: -250px;
      bottom: -250px;
      position: absolute;
      width: 500px;
      height: 500px;
      rotate: 45deg;
      z-index: 1;
    }
  </style>
</head>

<body id="advanced-layout-8">
  <header>
    <h1>Advanced Layout 8</h1>
  </header>
  <nav><a href="../index.html">Terug naar het overzicht</a></nav>
  <main></main>
  <footer></footer>
</body>

</html>
