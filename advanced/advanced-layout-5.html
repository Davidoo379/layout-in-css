<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Layout 5</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* Doe hier jouw ding! */
    body {
      display: grid;
      grid-template-columns: 1fr 20% 5% 20%;
      grid-template-rows: 10% 8% 2% 10% 1fr 10% 5%;
      margin: 1.5rem;
    }

    header {
      grid-column: 3/5;
      grid-row: 1/3;
      z-index: 2;
    }

    nav {
      grid-column: 2/4;
      grid-row: 2/5;
      z-index: 1;
    }

    main {
      grid-column: 1/3;
      grid-row: 4/7;
    }

    footer {
      grid-column: 2/5;
      grid-row: 6/8;
    }
  </style>
</head>

<body id="advanced-layout-5">
  <header>
    <h1>Advanced Layout 5</h1>
  </header>
  <nav><a href="../index.html">Terug naar het overzicht</a></nav>
  <main></main>
  <footer></footer>
</body>

</html>
