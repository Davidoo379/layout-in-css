<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Layout 9</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* Doe hier jouw ding! */
    header {
      position: absolute;
      left: 8rem;
      top: 18rem;
      width: 200px;
      height: 200px;
      border-radius: 9999px;
    }

    nav {
      position: absolute;
      right: 8rem;
      top: 8rem;
      width: 300px;
      height: 300px;
      z-index: -2;
      border-radius: 9999px;
    }

    main {
      position: absolute;
      left: 10rem;
      bottom: 10rem;
      width: 600px;
      height: 600px;
      z-index: -1;
      border-radius: 9999px;
    }

    footer {
      left: 4rem;
      bottom: 4rem;
      position: absolute;
      width: 300px;
      height: 300px;
      z-index: 1;
      border-radius: 9999px;
    }
  </style>
</head>

<body id="advanced-layout-9">
  <header>
    <h1>Advanced Layout 9</h1>
  </header>
  <nav><a href="../index.html">Terug naar het overzicht</a></nav>
  <main></main>
  <footer></footer>
</body>

</html>
