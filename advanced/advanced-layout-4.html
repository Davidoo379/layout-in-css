<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Layout 4</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* Doe hier jouw ding! */
    :root {
      --SLANT: 50px;
      --GAP: 50px;
      --OVERLAP: 150px
    }

    body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr var(--OVERLAP) 1fr;
      gap: var(--GAP);
      margin: 1.5rem;
    }

    header {
      grid-column: 2/3;
      grid-row: 1/3;
      clip-path:
        polygon(0 0,
          100% 0%,
          100% calc(100% - (var(--OVERLAP) - var(--GAP)) - var(--SLANT)),
          0 calc(100% - (var(--OVERLAP) - var(--GAP))));
    }

    nav {
      grid-column: 1/2;
      grid-row: 1/3;
      clip-path:
        polygon(0 0,
          100% 0%,
          100% calc(100% - (var(--OVERLAP) - var(--GAP))),
          0 calc(100% - (var(--OVERLAP) - var(--GAP)) + var(--SLANT)));
    }

    main {
      grid-column: 1/2;
      grid-row: 2/4;
      clip-path:
        polygon(0 calc(0% + (var(--OVERLAP) - var(--GAP)) + var(--SLANT)),
          100% calc(0% + (var(--OVERLAP) - var(--GAP))),
          100% 100%,
          0 100%);
    }

    footer {
      grid-column: 2/3;
      grid-row: 2/4;
      clip-path:
        polygon(0 calc(0% + (var(--OVERLAP) - var(--GAP))),
          100% calc(0% + (var(--OVERLAP) - var(--GAP)) - var(--SLANT)),
          100% 100%,
          0 100%);
    }
  </style>
</head>

<body id="advanced-layout-4">
  <header>
    <h1>Advanced Layout 4</h1>
  </header>
  <nav><a href="../index.html">Terug naar het overzicht</a></nav>
  <main></main>
  <footer></footer>
</body>

</html>
